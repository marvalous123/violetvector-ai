model: ollama_chat/war-room-thorough:latest
weak-model: ollama_chat/war-room-fast:latest
editor-model: ollama_chat/war-room-thorough:latest
model-settings-file: config/ollama/aider-model-settings.yml
model-metadata-file: config/ollama/aider-model-metadata.json
map-tokens: 2048
map-refresh: files
max-chat-history-tokens: 4096
auto-commits: false
dirty-commits: false
attribute-author: false
attribute-committer: false
attribute-commit-message-author: false
attribute-commit-message-committer: false
watch-files: false
auto-lint: false
auto-test: false
analytics: false
check-update: false
show-release-notes: false
gitignore: false
add-gitignore-files: false
suggest-shell-commands: false
restore-chat-history: false
encoding: utf-8
line-endings: lf
